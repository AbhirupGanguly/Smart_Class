<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Classroom Login</title>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
/* MAROON THEME GRADIENT */
background: linear-gradient(135deg, #4b0000, #1a1a1a);
margin:0;
padding:0;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-container{
width:90%;
max-width:400px;
}

.login-card{
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:12px;
backdrop-filter: blur(8px);
box-shadow:0px 4px 20px rgba(0,0,0,0.5);
}

h2{
text-align:center;
margin-bottom:25px;
}

label{
display:block;
margin-bottom:6px;
margin-top:12px;
font-size:14px;
}

input{
width:100%;
padding:10px;
border:none;
border-radius:6px;
margin-bottom:10px;
font-size:14px;
}

input:focus{
outline:none;
}

button{
width:100%;
padding:12px;
border:none;
/* KEEP BUTTON GREEN TO MATCH DASHBOARD */
background:#4CAF50;
color:white;
border-radius:6px;
cursor:pointer;
font-size:15px;
margin-top:10px;
}

button:hover{
background:#3d9441;
}

.footer{
text-align:center;
margin-top:15px;
font-size:13px;
opacity:0.8;
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:768px){

.login-card{
padding:25px;
}

h2{
font-size:20px;
}

}

@media(max-width:480px){

.login-card{
padding:20px;
}

input{
font-size:13px;
}

button{
font-size:14px;
}

}

</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

<h2>Smart Classroom Login</h2>

<form onsubmit="redirectHome(event)">

<label>Email</label>
<input type="email" name="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" name="password" placeholder="Enter your password" required>

<button type="submit">Login</button>

</form>

<div class="footer">
Smart Classroom AI System
</div>

</div>

</div>

<script>
    function redirectHome(e){
        e.preventDefault();   // stop form submission
        window.location.href = "home.html";  // redirect
    }
</script>

</body>
</html>
