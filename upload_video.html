<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Classroom Video</title>

<style>

/* SMOOTH FULL-PAGE GRADIENT */
body{
margin:0;
font-family: Arial, Helvetica, sans-serif;
color:white;
background: linear-gradient(
135deg,
#4b0000 0%,
#3a0b0b 25%,
#2b1616 50%,
#1f1f1f 75%,
#1a1a1a 100%
);
min-height:100vh;
}

/* HEADER */

.header{
background:rgba(0,0,0,0.7);
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

/* CONTAINER */

.container{
width:90%;
max-width:1100px;
margin:auto;
margin-top:50px;
}

/* CARD */

.card{
background:rgba(255,255,255,0.08);
padding:30px;
border-radius:16px;
backdrop-filter: blur(8px);
box-shadow:0px 4px 25px rgba(0,0,0,0.5);
}

/* TITLE */

h2{
margin-top:0;
margin-bottom:25px;
}

/* FIX OVERFLOW */
*{
box-sizing:border-box;
}

/* Upload box */
.upload-box{
display:block;        /* makes label take full width */
width:100%;
border:2px dashed rgba(255,255,255,0.35);
padding:65px 20px;
border-radius:14px;
text-align:center;
background:rgba(0,0,0,0.35);
cursor:pointer;
transition:0.3s;
}

.upload-box:hover{
border-color:#2ecc71;
background:rgba(0,0,0,0.5);
}

/* TEXT */

.upload-title{
font-size:22px;
font-weight:600;
margin-bottom:10px;
}

.upload-sub{
font-size:14px;
color:#cccccc;
}

/* HIDE INPUT */

.upload-box input{
display:none;
}

/* BUTTON */

.upload-btn{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:8px;
background:linear-gradient(90deg,#2ecc71,#27ae60);
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

.upload-btn:hover{
transform:scale(1.05);
}

/* INFO TEXT */

.info{
margin-top:15px;
font-size:14px;
color:#cccccc;
text-align:center;
}

/* RESPONSIVE */

@media(max-width:768px){

.header{
font-size:20px;
padding:15px;
}

.card{
padding:22px;
}

.upload-box{
padding:55px 15px;
}

.upload-title{
font-size:19px;
}

.upload-btn{
width:100%;
}

}

@media(max-width:480px){

.container{
width:92%;
margin-top:30px;
}

.card{
padding:18px;
}

.upload-box{
padding:45px 12px;
}

.upload-title{
font-size:17px;
}

}

</style>

</head>

<body>

<div class="header">
Smart Classroom Video Upload
</div>

<div class="container">

<div class="card">

<h2>Upload Classroom Video</h2>

<label class="upload-box">

<div class="upload-title">Drag & Drop Video Here</div>
<div class="upload-sub">or click to upload a classroom video</div>
<div class="upload-sub" style="margin-top:8px;">Supported formats: MP4, AVI, MOV</div>

<input type="file" accept="video/*">

</label>

<div class="info">
Upload a classroom video and the AI system will analyze student attention automatically.
</div>

<div style="text-align:center;">
<button class="upload-btn">Upload & Analyze</button>
</div>

</div>

</div>

</body>
</html>
